[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-bd"
version = "0.2.0"
description = "Persistent, evidence-grounded consulting outreach with explicit approval gates"
requires-python = ">=3.11,<3.14"
dependencies = ["huey>=2.5,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
